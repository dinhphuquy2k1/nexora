name: Preflight Policy & Design Governance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  preflight-governance:
    name: Preflight Governance & Duplication Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select pinned Node 24 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Run deterministic preflight policy check
        run: node scripts/preflight-policy-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run preflight policy check tests
        run: node --test scripts/preflight-policy-check.test.mjs
      - name: Temporary deterministic formatter diagnostics
        run: |
          npx --yes prettier@3.6.2 --write docs/decisions/mandatory-pre-code-design-review.md scripts/preflight-policy-check.mjs scripts/preflight-policy-check.test.mjs
          for path in docs/decisions/mandatory-pre-code-design-review.md scripts/preflight-policy-check.mjs scripts/preflight-policy-check.test.mjs; do
            printf 'NEXORA_FORMAT_BEGIN %s\n' "$path"
            base64 -w0 "$path"
            printf '\nNEXORA_FORMAT_END %s\n' "$path"
          done
