# First issuance only: no Web/API upstream or plaintext authentication.
events {worker_connections 128;}
http {
  access_log off;
  error_log /dev/stderr crit;
  server {
    listen 80 default_server;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {root /var/www/acme;}
    location / {return 404;}
  }
}
