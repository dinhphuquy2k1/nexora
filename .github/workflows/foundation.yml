name: Nexora foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      artifact_suffix:
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  docker-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: nexora-ci
      M1_EVIDENCE_DIR: artifacts/m1
      M2_EVIDENCE_DIR: artifacts/m2
      M3_EVIDENCE_DIR: artifacts/m3
      ACCOUNT_EVIDENCE_DIR: artifacts/account
      CARRIER_EVIDENCE_DIR: artifacts/carrier
      PUBLIC_HTTPS_DIAGNOSTICS_DIR: artifacts/public-https
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select pinned host Node for smoke harnesses
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Docker quality and migrated integration
        run: sh scripts/quality-docker.sh
      - name: Shared Pager and filter browser acceptance
        run: node scripts/pager-filter-browser-checks.mjs artifacts artifacts/pager-filter --acceptance
      - name: Stop development before runtime smoke
        run: docker compose -f compose.yml -f compose.dev.yml down
      - name: Local release runtime, provisioning, TTY and browser smoke
        run: sh scripts/runtime-smoke.sh
      - name: Disposable public HTTPS, ingress and remote onboarding
        run: sh scripts/public-https-smoke.sh
      - name: DB and storage persistence smoke
        run: sh scripts/data-smoke.sh
      - name: Development HMR and dependency drift smoke
        run: sh scripts/dev-smoke.sh
      - name: Preserve M1 browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-browser-evidence${{ inputs.artifact_suffix }}
          path: artifacts/m1
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Customer UI browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-ui-evidence${{ inputs.artifact_suffix }}
          path: artifacts/m2
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Retail M3 browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retail-m3-browser-evidence${{ inputs.artifact_suffix }}
          path: artifacts/m3
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Account Menu browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: account-menu-evidence${{ inputs.artifact_suffix }}
          path: artifacts/account
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Carrier UI browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carrier-ui-browser-evidence${{ inputs.artifact_suffix }}
          path: artifacts/carrier
          if-no-files-found: error
          retention-days: 14
      - name: Preserve shared Pager and filter browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pager-filter-browser-evidence${{ inputs.artifact_suffix }}
          path: artifacts/pager-filter
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve public HTTPS diagnostics
        if: failure() || inputs.artifact_suffix != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-https-diagnostics${{ inputs.artifact_suffix }}
          path: artifacts/public-https
          if-no-files-found: ignore
          retention-days: 7
      - name: Diagnostics
        if: failure()
        run: |
          docker compose -f compose.yml -f compose.dev.yml ps -a
          docker compose -f compose.yml -f compose.dev.yml logs --no-color
      - name: Remove only CI-owned volumes
        if: always()
        run: docker compose -f compose.yml -f compose.dev.yml down -v --remove-orphans
