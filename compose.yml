name: nexora
services:
  builder:
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
      target: deps
    image: nexora-builder:0.1.0
    restart: "no"
    entrypoint: ["true"]
  init:
    depends_on:
      builder: { condition: service_completed_successfully }
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
      target: tools
    image: nexora-tools:0.1.0
    user: "0:0"
    entrypoint: [sh, /scripts/init-local.sh]
    volumes:
      - credentials:/config
      - uploads:/uploads
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: nexora
      POSTGRES_DB: nexora
      POSTGRES_PASSWORD_FILE: /config/postgres_password
    volumes:
      - credentials:/config:ro
      - postgres:/var/lib/postgresql/data
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nexora -d nexora"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
      additional_contexts:
        base: service:builder
        tools: service:init
    image: nexora-migrate:0.1.0
    entrypoint: [sh, /scripts/api-entrypoint.sh]
    command:
      [
        node,
        node_modules/prisma/build/cli.js,
        migrate,
        deploy,
        --schema,
        prisma/schema.prisma,
      ]
    volumes:
      - credentials:/config:ro
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-runtime
      additional_contexts:
        base: service:builder
        tools: service:init
    image: nexora-api:0.1.0
    entrypoint: [sh, /scripts/api-entrypoint.sh]
    command: [node, dist/main.js]
    environment:
      NODE_ENV: production
      STORAGE_ROOT: /data/uploads
      API_DOCS_ENABLED: "false"
      WEB_PORT: "${WEB_PORT:-127.0.0.1:3001}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    volumes:
      - credentials:/config:ro
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 8s
      retries: 20
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web-runtime
      args:
        API_INTERNAL_URL: http://api:4000
      additional_contexts:
        base: service:builder
    image: nexora-web:0.1.0
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["${WEB_PORT:-127.0.0.1:3001}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 8s
      retries: 20
volumes:
  credentials:
  postgres:
  uploads:
